name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "炉管全生命周期管理系统.html"
      - "login.html"
      - "assets/**"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.test.mjs; do
            echo "== node $f"
            node "$f"
          done
          python tests/resolve_d1_id.test.py
          python -m pip install openpyxl==3.1.5
          python tests/test_clean_boiler_film_records.py

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          # dist is a tracked local artifact, so always rebuild it from scratch.
          # Otherwise stale app.css/app.js can survive and be published by Pages.
          rm -rf dist
          mkdir -p dist/assets
          cp "炉管全生命周期管理系统.html" dist/index.html
          cp "login.html" dist/login.html
          cp -R assets/. dist/assets/

          test -f dist/assets/app/app-v8.0.css
          test -f dist/assets/app/app-v7.9.js
          test -f dist/assets/app/maintenance-log-v1.css
          test -f dist/assets/app/ui-shell-v8.js
          test -f dist/assets/app/xlsx-export-v1.js
          test -f dist/assets/app/maintenance-log-v1.js
          test -f dist/assets/app/assistant-core-v1.js
          test -f dist/assets/app/assistant-analysis-v1.js
          test -f dist/assets/app/assistant-docs-v1.js
          test -f dist/assets/app/assistant-ui-v1.js
          test -f dist/assets/app/assistant-v1.js
          test -f dist/assets/app/assistant-v1.css
          grep -q 'assets/app/app-v8.0.css' dist/index.html
          grep -q 'assets/app/app-v7.9.js' dist/index.html
          grep -q 'assets/app/ui-shell-v8.js' dist/index.html
          grep -q 'assets/app/xlsx-export-v1.js' dist/index.html
          grep -q 'assets/app/maintenance-log-v1.js' dist/index.html
          grep -q 'assets/app/assistant-core-v1.js' dist/index.html
          grep -q 'assets/app/assistant-analysis-v1.js' dist/index.html
          grep -q 'assets/app/assistant-docs-v1.js' dist/index.html
          grep -q 'assets/app/assistant-ui-v1.js' dist/index.html
          grep -q 'assets/app/assistant-v1.js' dist/index.html
          grep -q 'assets/app/assistant-v1.css' dist/index.html
          grep -q 'assets/app/maintenance-log-v1.css' dist/index.html
          grep -q 'pdf.js/3.11.174/pdf.min.js' dist/index.html
          grep -q 'xlsx-0.20.3/package/dist/xlsx.full.min.js' dist/index.html
          test ! -e dist/assets/app/app.css
          test ! -e dist/assets/app/app.js

      - name: Check Cloudflare secrets
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::Cloudflare deployment skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then rerun this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Cloudflare config and D1
        id: database
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          DB_NAME="boiler_tube_lifecycle_management_system"
          npx --yes wrangler@latest d1 list --json > d1-list.json
          D1_DATABASE_ID="$(python scripts/resolve_d1_id.py d1-list.json "$DB_NAME")"
          if [[ -z "$D1_DATABASE_ID" ]]; then
            npx --yes wrangler@latest d1 create "$DB_NAME" > d1-create.txt
            D1_DATABASE_ID="$(python scripts/resolve_d1_id.py d1-create.txt "$DB_NAME")"
          fi
          if [[ -z "$D1_DATABASE_ID" ]]; then
            echo "Unable to resolve D1 database id."
            exit 1
          fi
          echo "Using D1 database '$DB_NAME' ($D1_DATABASE_ID)."
          cat > wrangler.toml <<EOF
          name = "boiler-tube-lifecycle-system"
          compatibility_date = "2026-07-14"
          pages_build_output_dir = "dist"

          [[d1_databases]]
          binding = "DB"
          database_name = "$DB_NAME"
          database_id = "$D1_DATABASE_ID"
          EOF
          npx --yes wrangler@latest pages project create boiler-tube-lifecycle-system --production-branch=main || true
          # The schema is idempotent; normal releases must preserve all existing rows.
          npx --yes wrangler@latest d1 execute DB --remote --file=migrations/0001_init.sql
          echo "admin_seeded=false" >> "$GITHUB_OUTPUT"
          if [[ -n "${APP_ADMIN_USERNAME//[[:space:]]/}" && -n "${APP_ADMIN_PASSWORD//[[:space:]]/}" ]]; then
            npx --yes wrangler@latest d1 execute DB --remote --command="SELECT COUNT(*) AS admin_user_count FROM users WHERE role = 'admin';" --json > admin-count.json
            ADMIN_COUNT="$(python -c 'import json; data = json.load(open("admin-count.json")); count = data[0]["results"][0]["admin_user_count"]; assert type(count) is int and count >= 0; print(count)')"
            if [[ "$ADMIN_COUNT" == "0" ]]; then
              # Keep the manual password-reset helper unchanged; deployment only inserts.
              umask 077
              trap 'rm -f seed-admin.sql seed-admin-result.json' EXIT
              python - > seed-admin.sql <<'PY'
          import base64
          import hashlib
          import os
          from scripts.hash_password_sql import ITERATIONS, sql_literal

          username = os.environ["APP_ADMIN_USERNAME"].strip()
          password = os.environ["APP_ADMIN_PASSWORD"].strip()
          if not username or len(password) < 8:
              raise SystemExit("Admin seed requires a username and a password of at least 8 characters.")
          salt = os.urandom(16)
          digest = hashlib.pbkdf2_hmac("sha256", password.encode("utf-8"), salt, ITERATIONS, dklen=32)
          print(
              "INSERT INTO users (username, role, password_hash, salt, iterations) "
              f"SELECT {sql_literal(username)}, 'admin', {sql_literal(base64.b64encode(digest).decode('ascii'))}, "
              f"{sql_literal(base64.b64encode(salt).decode('ascii'))}, {ITERATIONS} "
              "WHERE NOT EXISTS (SELECT 1 FROM users WHERE role = 'admin') "
              "ON CONFLICT(username) DO NOTHING;"
          )
          PY
              # Wrangler may include SQL in diagnostics; never log credential material.
              if ! npx --yes wrangler@latest d1 execute DB --remote --file=seed-admin.sql --json > seed-admin-result.json 2>&1; then
                echo "::error::Admin initialization failed; existing users were not overwritten."
                exit 1
              fi
              ADMIN_INSERTED="$(python -c 'import json; data = json.load(open("seed-admin-result.json")); count = data[0]["meta"]["changes"]; assert type(count) is int and count in (0, 1); print(count)')"
              if [[ "$ADMIN_INSERTED" == "1" ]]; then
                echo "admin_seeded=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::Admin seed skipped because an admin or the configured username already exists; no account was changed."
              fi
            else
              echo "Existing admin accounts preserved; bootstrap credentials were not applied."
            fi
          else
            echo "::warning::APP_ADMIN_USERNAME or APP_ADMIN_PASSWORD is missing. Existing accounts are unchanged; a first installation still needs an admin."
          fi

      - name: Publish to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=boiler-tube-lifecycle-system --branch=${{ github.ref_name }}

      - name: Sync LLM server key (optional)
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "${LLM_API_KEY:-}" ]]; then
            echo "::warning::LLM_API_KEY not configured. The AI panel will require a browser-side API key until the LLM_API_KEY repository secret is set."
            exit 0
          fi
          echo "$LLM_API_KEY" | npx --yes wrangler@latest pages secret put LLM_API_KEY --project-name=boiler-tube-lifecycle-system
          if [[ -n "${LLM_BASE_URL:-}" ]]; then
            echo "$LLM_BASE_URL" | npx --yes wrangler@latest pages secret put LLM_BASE_URL --project-name=boiler-tube-lifecycle-system
          fi
          if [[ -n "${LLM_MODEL:-}" ]]; then
            echo "$LLM_MODEL" | npx --yes wrangler@latest pages secret put LLM_MODEL --project-name=boiler-tube-lifecycle-system
          fi

      - name: Smoke test deployed login
        if: steps.cloudflare.outputs.ready == 'true' && steps.database.outputs.admin_seeded == 'true'
        shell: bash
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ADMIN_USERNAME//[[:space:]]/}" || -z "${APP_ADMIN_PASSWORD//[[:space:]]/}" ]]; then
            echo "::warning::Login smoke test skipped because admin seed credentials are missing."
            exit 0
          fi
          umask 077
          trap 'rm -f login-response.json session-response.json login-cookies.txt' EXIT
          payload="$(python -c 'import json, os; print(json.dumps({"username": os.environ["APP_ADMIN_USERNAME"], "password": os.environ["APP_ADMIN_PASSWORD"]}))')"
          status="$(curl -sS -o login-response.json -c login-cookies.txt -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            https://btgs.wegpt.top/api/auth/login)"
          echo "login_status=$status"
          if [[ "$status" != "200" ]]; then
            echo "::error::Deployed login endpoint rejected the seeded admin credentials."
            exit 1
          fi
          session_status="$(curl -sS -o session-response.json -b login-cookies.txt -w "%{http_code}" \
            https://btgs.wegpt.top/api/auth/session)"
          echo "session_status=$session_status"
          if [[ "$session_status" != "200" ]]; then
            echo "::error::Deployed session endpoint did not accept the login cookie."
            exit 1
          fi
